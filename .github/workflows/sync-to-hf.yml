name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "inference/**"
      - "models/**"
      - "requirements.txt"
      - "README.hf.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Space contents
        run: |
          mkdir -p hf_space
          cp app.py hf_space/
          cp requirements.txt hf_space/
          cp -r inference hf_space/
          cp -r models hf_space/
          cp README.hf.md hf_space/README.md

      - name: Push to Hugging Face
        uses: huggingface/hub-sync@main
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: <your-hf-username>/smart-city-monitor
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
