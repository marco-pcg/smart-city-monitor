name: Release Models

on:
  release:
    types: [published]

jobs:
  bundle-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Zip model artifacts
        run: |
          cd models
          zip -r ./train/models-${{ github.ref_name }}.zip . -x "*.DS_Store"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: models-${{ github.ref_name }}.zip
